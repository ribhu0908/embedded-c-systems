name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gcc
        run: make clean test
      - name: clang
        run: make clean test CC=clang
      - name: ASan + UBSan
        run: make clean sanitize
      - name: demo
        run: make clean demo
      - name: Cortex-M4 cross-compile
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          make clean arm
